name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Set this once in GitHub:
      # Settings -> Secrets and variables -> Actions -> Variables
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Check EXPO_PUBLIC_API_URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error title=Missing API URL::Add EXPO_PUBLIC_API_URL as a repository variable (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plada-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
